<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Grid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Premium responsive CSS Grid for movie cards */
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      padding: 2rem;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0d0d2b, #1a1a40);
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .title {
      font-size: 2.5rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      background: linear-gradient(90deg, #ff8a00, #e52e71);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: fadeIn 1s ease forwards;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
      width: 100%;
      max-width: 1200px;
      padding: 1rem;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 1rem;
      overflow: hidden;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      text-align: center;
    }
    .card img { width: 100%; height: auto; display: block; }
    .card h3 { margin: 0.8rem 0 0.3rem; font-size: 1.2rem; font-weight: 500; color: #fff; }
    .card p { margin: 0 0 0.8rem; font-size: 0.9rem; color: #cfcfcf; }
    .card:hover { transform: translateY(-8px) scale(1.02); box-shadow: 0 12px 48px rgba(0,0,0,0.5); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 600px) { .title { font-size: 2rem; } body { padding: 1rem; } }
  </style>
</head>
<body>
  <h1 class="title">Featured Movies</h1>
  <section class="grid">
    <article class="card">
      <img src="https://via.placeholder.com/300x180?text=Movie+1" alt="Movie 1 Poster" />
      <h3>Movie Title 1</h3>
      <p>Genre • Year</p>
    </article>
    <article class="card">
      <img src="https://via.placeholder.com/300x180?text=Movie+2" alt="Movie 2 Poster" />
      <h3>Movie Title 2</h3>
      <p>Genre • Year</p>
    </article>
    <article class="card">
      <img src="https://via.placeholder.com/300x180?text=Movie+3" alt="Movie 3 Poster" />
      <h3>Movie Title 3</h3>
      <p>Genre • Year</p>
    </article>
    <article class="card">
      <img src="https://via.placeholder.com/300x180?text=Movie+4" alt="Movie 4 Poster" />
      <h3>Movie Title 4</h3>
      <p>Genre • Year</p>
    </article>
    <!-- Add more cards as needed -->
  </section>
</body>
</html>
